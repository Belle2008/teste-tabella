<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabela Periódica</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>

    <div class="tabela-periodica" id="tabela"></div>

    <div id="tooltip-global" class="tooltip-fixa" style="display: none;"></div>

    <div id="caixacalculo" class="caixacalculo">
        <h2>Escolha dois elementos para calcular a força elétrica entre eles</h2>
        <div class="tabela-periodica-calculo">
            <div class="elemento-calculo" id="h" data-carga="1e-6">H</div>
            <div class="elemento-calculo" id="he" data-carga="-1e-6">He</div>
            <!-- Adicione mais elementos aqui -->
        </div>
    </div>

    <script src="./dados_quimica.js"></script>
    <script src="./script.js"></script>
</body>
</html>
